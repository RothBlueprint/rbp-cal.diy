name: Validate images

# Builds both images WITHOUT pushing, so a Dockerfile or dependency change is
# caught on the pull request instead of after it merges.
#
# Deliberately separate from build-images.yml rather than another trigger on it:
# that workflow pushes to GHCR and has a deploy job gated only on a repo
# variable, and a pull_request trigger there would be one `if:` away from
# deploying from an unmerged branch. This one has no registry credentials and no
# deploy job, so it cannot ship anything.
#
# Build-args mirror build-images.yml. They are placeholders — the web image
# rewrites NEXT_PUBLIC_WEBAPP_URL at container start and the api build only needs
# a syntactically valid DATABASE_URL for `prisma generate`.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "apps/api/v2/Dockerfile"
      - "**/package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".nvmrc"
      - "scripts/**"
      - ".github/workflows/validate-images.yml"
  workflow_dispatch:

# A new push to the same PR makes the in-flight build irrelevant.
concurrency:
  group: validate-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            file: ./Dockerfile
            cache-scope: web
            build-args: |
              NEXT_PUBLIC_WEBAPP_URL=https://calendar.rothblueprint.com
              NEXT_PUBLIC_API_V2_URL=https://calendar-api.rothblueprint.com/v2
              DATABASE_URL=postgresql://user:pass@localhost:5432/db
              CALCOM_TELEMETRY_DISABLED=1
          - name: api
            file: ./apps/api/v2/Dockerfile
            cache-scope: api
            build-args: |
              DATABASE_URL=postgresql://user:pass@localhost:5432/db
              DATABASE_DIRECT_URL=postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          # Reads the cache build-images.yml populates on main, but writes to a
          # separate scope so a pull request cannot poison the release build's cache.
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}-pr
          build-args: ${{ matrix.build-args }}
