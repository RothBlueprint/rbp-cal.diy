name: Build & Deploy

# Builds the two cal images, pushes them to GHCR tagged by branch, then
# deploys digest-pinned to ECS (rbp-fargate) via .github/scripts/cal-deploy.sh:
#   ghcr.io/rothblueprint/rbp-cal-web:<branch>  (Next.js web, port 3000)
#   ghcr.io/rothblueprint/rbp-cal-api:<branch>  (NestJS API v2, port 5555)
#
# The deploy job is inert until repo VARIABLES are set (after the
# CalendarStack lands via cdktf):
#   DEPLOY_ENABLED       "true" to activate the deploy job
#   AWS_DEPLOY_ROLE_ARN  rbp-calendar-deploy role ARN (CalendarStack output)
#   MIGRATE_SUBNETS      comma-separated private subnet ids
#   MIGRATE_SG           cal tasks security group id
#
# Build-args are placeholders: the web image rewrites NEXT_PUBLIC_WEBAPP_URL
# at container start (scripts/replace-placeholder.sh), and the api build
# only needs a syntactically valid DATABASE_URL for prisma generate.
# Real configuration arrives at runtime from AWS Secrets Manager.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose image tag
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${{ env.REGISTRY }}/${OWNER}/rbp-cal-web:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build & push web
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://calendar.rothblueprint.com
            NEXT_PUBLIC_API_V2_URL=https://calendar-api.rothblueprint.com/v2
            DATABASE_URL=postgresql://user:pass@localhost:5432/db
            CALCOM_TELEMETRY_DISABLED=1

  build-api:
    name: Build api image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose image tag
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${{ env.REGISTRY }}/${OWNER}/rbp-cal-api:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build & push api
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/v2/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          build-args: |
            DATABASE_URL=postgresql://user:pass@localhost:5432/db
            DATABASE_DIRECT_URL=postgresql://user:pass@localhost:5432/db

  deploy:
    name: Deploy to ECS
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: [build-web, build-api]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy digest-pinned to ECS
        env:
          AWS_REGION: us-west-2
          CLUSTER: rbp-fargate
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
          API_IMAGE: ${{ needs.build-api.outputs.image }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          MIGRATE_SUBNETS: ${{ vars.MIGRATE_SUBNETS }}
          MIGRATE_SG: ${{ vars.MIGRATE_SG }}
        run: |
          chmod +x .github/scripts/cal-deploy.sh
          ./.github/scripts/cal-deploy.sh
